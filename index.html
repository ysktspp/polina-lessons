<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Клас Поліни — уроки онлайн</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff7fb; --card:#ffffff; --ink:#2b2a33; --muted:#6f6c7a; --line:#f3dbe6;
  --math:#3b7ddd; --ukr:#e0a400; --eng:#d94f6b; --yds:#2f9e6a;
  --ok:#2f9e6a; --bad:#d94f4f; --accent:#0f9e90; --pink:#ff5fa2; --turq:#2cc9b8;
}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:16px}
.crumbs{font-size:14px;color:var(--muted);margin:4px 0 14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.crumbs a{color:var(--accent);text-decoration:none;font-weight:700}
.grid{display:grid;gap:12px}
.tile{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;text-decoration:none;color:inherit;transition:transform .1s}
.tile:active{transform:scale(.98)}
.tile .ic{font-size:26px;font-weight:800;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;flex:none;color:var(--accent)}
.tile b{display:block;font-size:19px}
.tile small{color:var(--muted);font-size:14px}
.tile .st{margin-left:auto;font-size:22px}
.soon{opacity:.55}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.card h2{margin:0 0 8px;font-size:21px}
.card h3{margin:0 0 8px;font-size:18px}
.badge{display:inline-block;font-size:13px;font-weight:800;color:#fff;border-radius:999px;padding:3px 10px;margin-bottom:8px}
.src{font-size:13px;color:var(--muted);font-weight:700}
.theory{background:#effbf9;border-left:5px solid var(--accent);border-radius:12px;padding:12px 14px;margin:10px 0}
.theory p{margin:6px 0}
.theory table{border-collapse:collapse;margin:8px 0;font-size:15px}
.theory td,.theory th{border:1px solid #b9ebe5;padding:4px 8px;text-align:center;background:#fff}
.theory th{background:#d5f5f0}
.theory ol,.theory ul{margin:6px 0;padding-left:22px}
.col{font-family:ui-monospace,Menlo,Consolas,monospace;background:#fff;border-radius:10px;padding:8px 12px;display:inline-block;line-height:1.6;font-size:15px;white-space:pre}
.ex{border-top:2px dashed var(--line);padding-top:14px;margin-top:14px}
.ex.first{border-top:none;padding-top:0;margin-top:0}
.q{font-weight:700;margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 14px;font:inherit;cursor:pointer;color:inherit}
.opt.sel{border-color:var(--accent);background:#ffe6f1}
.opt.right{border-color:var(--ok);background:#e5f6ee}
.opt.wrong{border-color:var(--bad);background:#fdeaea}
input.ans,select.ans{font:inherit;border:2px solid var(--line);border-radius:10px;padding:5px 8px;background:#fff;color:inherit}
input.ans{width:110px}
input.ans.sm{width:72px;text-align:center}
input.ans.wide{width:100%;max-width:340px}
span.ans{border:2px solid var(--line);border-radius:10px;background:#fff}
input.ans.right,select.ans.right,span.ans.right{border-color:var(--ok);background:#e5f6ee}
input.ans.wrong,select.ans.wrong,span.ans.wrong{border-color:var(--bad);background:#fdeaea}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0}
.word{font-weight:800;font-size:19px;letter-spacing:.5px;color:var(--accent)}
.btn{font:inherit;font-weight:800;border:none;border-radius:12px;padding:10px 18px;cursor:pointer;background:var(--accent);color:#fff}
.btn.ghost{background:#ffe6f1;color:var(--accent)}
details.hint{margin:6px 0 4px;font-size:15px}
details.hint summary{cursor:pointer;color:var(--accent);font-weight:700}
details.hint div{background:#fffbea;border:1px solid #f3e3a0;border-radius:10px;padding:8px 10px;margin-top:6px}
.fb{margin-top:8px;font-weight:700;min-height:1.2em}
.fb.ok{color:var(--ok)} .fb.no{color:var(--bad)}
.read{background:#fff;border:2px solid #b9ebe5;border-radius:12px;padding:10px 14px;margin:8px 0;font-size:16px}
.read ol{margin:4px 0;padding-left:22px}.read li{margin:4px 0}.read .rt{font-weight:800;color:var(--accent);margin:0}
.rb{margin:6px 0 12px}
.rdisp{display:inline-block;min-width:120px;min-height:38px;font-size:22px;font-weight:800;letter-spacing:3px;font-family:Georgia,serif;padding:3px 12px}
.rkeys{display:flex;flex-wrap:wrap;gap:8px}
.rk{font:inherit;font-family:Georgia,serif;font-size:22px;font-weight:800;width:48px;height:48px;border-radius:12px;border:2px solid #b9ebe5;background:#effbf9;color:var(--accent);cursor:pointer}
.rk:active{transform:scale(.94)}
.rk.del{font-family:inherit;font-size:20px;background:#fff;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:12px 0 6px}
.fc{font:inherit;font-weight:800;font-size:17px;min-height:64px;border-radius:14px;border:2px solid #f3dfa6;background:#fff;cursor:pointer;color:var(--ink);padding:8px}
.fc .b{display:none;color:var(--accent)} .fc.flip{background:#ffe6f1;border-color:#b9ebe5} .fc.flip .f{display:none} .fc.flip .b{display:inline}
.test a{color:var(--accent);font-weight:800}
.hw{background:#fff8e6;border:2px solid #f3dfa6}
.test{background:#eef6ff;border:2px solid #c8defa}
.done-btn{width:100%;margin-top:6px;padding:14px}
.prog{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--ok)}
.note{font-size:14px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#2b2a33;color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
textarea.report{width:100%;min-height:140px;font:inherit;font-size:14px;border:2px solid var(--line);border-radius:12px;padding:10px}

#mebar{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.9);border-radius:999px;padding:4px 12px 4px 4px;text-decoration:none;color:var(--ink);font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.12);flex:none}
#mebar .mini{width:44px;height:44px;border-radius:50%;overflow:hidden;display:block;background:#fff}
#mebar .mini svg{width:44px;height:57px;margin-top:-2px}
#mebar.pop{animation:pop .6s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.av-card{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap;background:linear-gradient(135deg,#e6faf7,#ffe6f1)}
.av-big{width:170px;flex:none}.av-big svg{width:100%;height:auto;display:block;border-radius:24px;box-shadow:0 4px 14px rgba(0,0,0,.1)}
.av-side{flex:1;min-width:160px}
.bank{font-size:34px;font-weight:800;color:#e0a400}
.cats{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:4px}
.cat{font:inherit;font-weight:700;font-size:15px;white-space:nowrap;border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;cursor:pointer;color:var(--ink)}
.cat.on{background:var(--turq);border-color:var(--turq);color:#fff}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;cursor:pointer}
.item.trying{border-color:var(--pink);box-shadow:0 0 0 3px #ffd6e8}
.item b{font-size:15px;line-height:1.25}
.item small{color:var(--muted);font-size:12px}
.sw{width:46px;height:46px;border-radius:50%;border:2px solid #eee;display:grid;place-items:center;font-size:26px}
.sw.emo{border:none;background:#fff4f9}
.btn.sm{padding:7px 12px;font-size:14px}
.btn.pink{background:var(--pink)}
.tag.on{font-weight:800;color:var(--ok);font-size:14px;padding:7px 0}
.tile.avatar-tile{background:linear-gradient(135deg,#e6faf7,#ffe6f1);border-color:#ffc6de}
.tile.avatar-tile .ic{background:#fff;overflow:hidden;padding:0}.tile.avatar-tile .ic svg{width:52px;height:68px;margin-top:-4px}

body{background-image:radial-gradient(circle at 8% 18%,rgba(44,201,184,.16) 0%,transparent 38%),radial-gradient(circle at 92% 82%,rgba(255,95,162,.14) 0%,transparent 40%);background-attachment:fixed;min-height:100vh;position:relative;isolation:isolate}
.topbar{position:sticky;top:10px;z-index:30;max-width:760px;margin:10px auto 0;padding:0 12px}
.navbar{background:rgba(255,255,255,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,182,213,.7);border-radius:999px;padding:6px 6px 6px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;box-shadow:0 4px 18px rgba(255,95,162,.12)}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:17px;color:#0f9e90;text-decoration:none}
.brand .bi{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#2cc9b8,#ff7eb6);font-size:18px}
.hero{position:relative;overflow:hidden;text-align:center;border-radius:26px;padding:30px 18px 24px;margin:4px 0 18px;background:linear-gradient(150deg,rgba(255,255,255,.92) 0%,rgba(230,250,247,.9) 55%,rgba(255,236,245,.92) 100%);border:1px solid #ffc6de;box-shadow:0 8px 26px rgba(44,201,184,.14)}
.hero>*{position:relative;z-index:1}
.hero::before,.hero::after{content:"";position:absolute;z-index:0;border-radius:47% 53% 61% 39%/45% 38% 62% 55%;filter:blur(16px);pointer-events:none}
.hero::before{width:240px;height:180px;left:-70px;top:-60px;background:rgba(44,201,184,.32)}
.hero::after{width:260px;height:200px;right:-80px;bottom:-80px;background:rgba(255,95,162,.3)}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #ffc6de;color:#ff3d8b;font-weight:800;font-size:12px;padding:5px 12px;border-radius:999px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.hero h1{margin:0 0 8px;font-size:clamp(30px,8vw,42px);font-weight:900;line-height:1.12;color:#0f9e90}
.hero h1 span{background:linear-gradient(120deg,#2cc9b8 0%,#ff5fa2 55%,#b56cf0 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero-sub{color:var(--muted);font-weight:600;margin:0 auto 14px;max-width:460px}
.hero-slogan{display:inline-block;background:#fff;border:2px dashed #ff9fc4;padding:8px 18px;border-radius:999px;font-weight:800;color:#ff3d8b}
.hero-deco{position:absolute;z-index:0!important;font-size:44px;opacity:.55;pointer-events:none}
.hero-deco.l{left:10px;top:12px;transform:rotate(-12deg)}.hero-deco.r{right:10px;top:14px;transform:rotate(12deg)}
.emoji-bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:-1}
.fe{position:absolute;display:block;opacity:.2;user-select:none;will-change:transform;animation:fe var(--d,18s) ease-in-out infinite alternate;animation-delay:var(--dl,0s)}
@keyframes fe{0%{transform:translate3d(0,0,0) rotate(-12deg)}50%{transform:translate3d(var(--mx,30px),var(--my,-25px),0) rotate(10deg)}100%{transform:translate3d(calc(var(--mx,30px)*-.5),calc(var(--my,-25px)*-.5),0) rotate(-5deg)}}
@media (prefers-reduced-motion:reduce){.fe{animation:none}}
main{position:relative}

.fabs{position:fixed;left:0;right:0;bottom:14px;z-index:25;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 14px;max-width:760px;margin:0 auto}
.fab{pointer-events:auto;border:none;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18);text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px}
.fab.home{background:#fff;color:#0f9e90;border:2px solid #b9ebe5;border-radius:999px;padding:10px 16px;font-size:15px}
.fab.up{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#2cc9b8,#ff7eb6);color:#fff;font-size:26px;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}
.fab.up.on{opacity:1;transform:none;pointer-events:auto}
.fab.home.hide{visibility:hidden}
main{padding-bottom:90px}
.lnav{display:flex;gap:10px;margin-top:14px}
.lnav a{flex:1;text-decoration:none;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.lnav a small{color:var(--muted);font-size:12px;font-weight:700}
.lnav a b{font-size:15px;line-height:1.25}
.lnav a.next{text-align:right;border-color:#ffc6de;background:linear-gradient(135deg,#fff,#ffeef6)}
.lnav a.empty{visibility:hidden}
.lnav-top{display:flex;justify-content:space-between;gap:8px;margin:-6px 0 12px}
.lnav-top a{font-size:13px;font-weight:800;color:#0f9e90;text-decoration:none;background:#fff;border:1px solid #b9ebe5;border-radius:999px;padding:5px 11px}
.lnav-top a.empty{visibility:hidden}
</style>
</head>
<body>
<div class="emoji-bg" aria-hidden="true"></div>
<header class="topbar"><nav class="navbar">
  <a class="brand" href="#"><span class="bi">🌸</span><span>Уроки Поліни</span></a>
  <a id="mebar" href="#avatar" title="Мій аватар"></a>
</nav></header>
<main id="app"></main>
<div class="toast" id="toast"></div>
<div class="fabs">
  <a id="homeBtn" class="fab home" href="#">🏠 <span>Головна</span></a>
  <button id="topBtn" class="fab up" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="Нагору">↑</button>
</div>

<script>
/* ================= НАЛАШТУВАННЯ ================= */
const SUBJ = {
  math:{name:"Математика", ic:"🔢", c:"var(--math)", bg:"#e8f0fc"},
  ukr: {name:"Українська мова", ic:"✍️", c:"var(--ukr)", bg:"#fdf3d6"},
  eng: {name:"Англійська мова", ic:"🔤", c:"var(--eng)", bg:"#fbe5ea"},
  yds: {name:"Я досліджую світ", ic:"🌍", c:"var(--yds)", bg:"#e3f4ec"}
};
const DAYS = [
  {id:"mon", name:"Понеділок", short:"Пн", subj:["math","ukr"]},
  {id:"tue", name:"Вівторок",  short:"Вт", subj:["math","ukr","eng","yds"]},
  {id:"wed", name:"Середа",    short:"Ср", subj:["math","ukr","eng"]},
  {id:"thu", name:"Четвер",    short:"Чт", subj:["math","ukr","yds"]},
  {id:"fri", name:"П'ятниця",  short:"Пт", subj:["math","ukr","eng","yds"]}
];
/* Понеділок кожного тижня (рік, місяць 1–12, день) */
const WEEK_START = { 1:[2026,11,23] };
const MONTHS = ["січня","лютого","березня","квітня","травня","червня","липня","серпня","вересня","жовтня","листопада","грудня"];
function dayDate(w,i){ const s=WEEK_START[w]; if(!s) return null; const d=new Date(s[0],s[1]-1,s[2]+i); return d; }
function fmt(d){ return d.getDate()+" "+MONTHS[d.getMonth()]; }
function weekRange(w){ const a=dayDate(w,0), b=dayDate(w,4); if(!a) return ""; return a.getMonth()===b.getMonth() ? `${a.getDate()}–${b.getDate()} ${MONTHS[b.getMonth()]}` : `${fmt(a)} – ${fmt(b)}`; }

/* ================= УРОКИ =================
   Ключ: "тиждень-день-предмет".
   Типи вправ:
   choice — вибір однієї відповіді;   tf — правда / неправда;
   fill   — рядки з віконцями: [[відповідь]] (кілька правильних — через |);
   select — випадні списки: [підпис, [варіанти], номер правильного].
   hint — підказка до вправи;  hw:true — вправа для перевірки домашнього. */
const LESSONS = {

"1-mon-math":{
  topic:"Задачі на обчислення часу в межах століття",
  src:"Підручник: с. 79–80",
  summary:"Вчимося рахувати, скільки часу минуло між двома датами: скільки років прожила людина, скільки часу пройшло між подіями.",
  theory:`<p><b>Пригадай:</b> 1 рік = 12 місяців, 1 століття = 100 років.</p>
  <p><b>Як порахувати час між двома датами:</b></p>
  <ol>
   <li>Для кожної дати запиши, скільки <b>повних</b> років, місяців і днів минуло від початку літочислення. Для дати <i>9 березня 1814 р.</i> це <b>1813 р. 2 міс. 8 днів</b> — бо 1814-й рік ще не закінчився, пройшли тільки січень і лютий, а від березня — 8 повних днів.</li>
   <li>Від пізнішої дати віднімаємо ранішу — <b>стовпчиком</b>: дні від днів, місяці від місяців, роки від років.</li>
  </ol>
  <p><b>Приклад.</b> Т. Г. Шевченко народився 9 березня 1814 р., а помер 10 березня 1861 р.</p>
  <div class="col">– 1860 р.  2 міс.  9 днів
  1813 р.  2 міс.  8 днів
  ─────────────────────────
    47 р.  0 міс.  1 день</div>
  <p>Тарас Шевченко прожив <b>47 років і 1 день</b>.</p>
  <p>💡 Якщо треба знайти <b>кінець</b> події — додаємо, якщо <b>початок</b> — віднімаємо.</p>`,
  ex:[
    {type:"fill", q:"Обчисли усно (№1). Скільки це років і місяців?",
     hint:"12 місяців = 1 рік. Від числа місяців віднімай по 12: 25 міс. = 12 + 12 + 1, тобто 2 р. 1 міс.",
     lines:["13 міс. = [[1]] р. [[1]] міс.","18 міс. = [[1]] р. [[6]] міс.","25 міс. = [[2]] р. [[1]] міс.","33 міс. = [[2]] р. [[9]] міс."]},
    {type:"fill", q:"Т. Г. Шевченко народився 9 березня 1814 року. Коли йому виповнилося 47 років і 1 день? (№2-Б)",
     hint:"Додай стовпчиком: 1813 р. 2 міс. 8 днів + 47 р. 0 міс. 1 день. Вийде, скільки часу минуло — а сама подія відбулася в наступному році, наступному місяці й наступного дня.",
     lines:["Минуло: [[1860]] р. [[2]] міс. [[9]] днів","Подія відбулася [[10]] березня [[1861]] року."]},
    {type:"fill", q:"Олег народився 5 квітня 2014 року. Скільки йому років, якщо сьогодні 10 листопада 2021 року? (№3)",
     hint:"5 квітня 2014 р.: повних років — 2013, повних місяців — 3 (січень, лютий, березень), днів — 4. Так само для 10 листопада 2021 р. Потім відніми стовпчиком.",
     lines:["5 квітня 2014 р. → [[2013]] р. [[3]] міс. [[4]] дн.","10 листопада 2021 р. → [[2020]] р. [[10]] міс. [[9]] дн.","Олегові: [[7]] р. [[7]] міс. [[5]] дн."]},
    {type:"fill", q:"Цікаві факти про Т. Шевченка (№4). Прочитай факти. Який тебе зацікавив найбільше? Потім запиши числівники цифрами.",
     text:`<p class="rt">📖 Математична цікавинка</p><ol>
      <li>Тарас Шевченко був невисокого зросту — приблизно сто шістдесят п'ять сантиметрів.</li>
      <li>Тисяча триста вісімдесят чотири — саме стільки пам'ятників Тарасові Шевченку встановлено у світі.</li>
      <li>Найвідомішій книжці поета — «Кобзар» — у Черкасах присвячений цілий музей. Збірку перекладено на понад сто мов.</li>
      <li>Тарас Шевченко знаний серед його сучасників передусім як художник. На сьогодні збереглося вісімсот тридцять п'ять його художніх робіт.</li>

"1-mon-ukr":{

  src:"Підручник: с. 77–80, 88",
  summary:"Повторюємо будову слова і готуємося до діагностувальної роботи, яка буде у вівторок.",
  theory:`<p><b>Частини слова</b></p>
  <table>
   <tr><th>Частина</th><th>Що це</th><th>Знак</th></tr>
   <tr><td><b>Префікс</b></td><td>стоїть перед коренем</td><td>⌐</td></tr>

   <tr><td><b>Суфікс</b></td><td>після кореня, перед закінченням</td><td>^</td></tr>
   <tr><td><b>Закінчення</b></td><td>змінна частина слова</td><td>□</td></tr>
   <tr><td><b>Основа</b></td><td>слово без закінчення</td><td>___</td></tr>
  </table>
  <p><b>Як розібрати слово за будовою</b></p>
  <ol>
   <li>Назви слово.</li>
   <li>Зміни форму слова (постав питання) — і визнач <b>закінчення</b>. Основа — усе, крім закінчення.</li>
   <li>Добери споріднені слова — і визнач <b>корінь</b>.</li>
   <li>Визнач <b>префікс</b> і <b>суфікс</b>, якщо вони є.</li>
  </ol>
  <p>Наприклад: <i>під-вод-н-ий</i> — префікс <b>під</b>, корінь <b>вод</b>, суфікс <b>н</b>, закінчення <b>ий</b>.</p>
  <p>💡 Якщо слово змінюється, а в кінці нічого не змінюється (<i>ліс — лісу — лісом</i>), то в називному відмінку закінчення <b>нульове</b> □.</p>
  <p><b>Спорідненими</b> є слова з однаковим коренем і близькі за значенням: <i>вода — водний — підводний</i>. А <i>водити</i> — не споріднене, бо значення інше!</p>
  <p>💡 У коренях споріднених слів можуть чергуватися звуки: <b>г — ж — з</b> (дорога — доріжка — у дорозі), <b>к — ч — ц</b> (молоко — молочний — у молоці), <b>х — ш — с</b> (муха — мушка — на мусі).</p>
  <p><b>Префікси з- і с-.</b> Перед буквами <b>к, п, т, ф, х</b> пишемо <b>с-</b>, перед усіма іншими — <b>з-</b>. Запам'ятай: «<b>Кафе «Птах»</b>»: <i>сказати, сфотографувати, сховати</i>, але <i>зробити, зшити, зчесати</i>.</p>
  <p><b>Складні слова</b> мають два корені, які з'єднуються буквами <b>о</b> або <b>е</b>: <i>мухоловка</i> = муха + ловити, <i>книголюб</i> = книга + любити, <i>вогнегасник</i> = вогонь + гасити.</p>
  <p><b>Апостроф після префікса</b> пишемо перед <b>я, ю, є, ї</b>: <i>роз'їзд, з'їсти, об'єднання</i>.</p>`,
  ex:[
    {type:"choice", q:"Яке слово НЕ споріднене з іншими? Вода, водний, заводнений, водити",
     hint:"Споріднені слова мають однаковий корінь і близьке значення. Чи пов'язане значення кожного слова з водою?",
     options:["водний","заводнений","водити"], answer:2},
    {type:"choice", q:"Яке слово НЕ споріднене з іншими? Дорога, дорожній, дорогий, доріженька",
     hint:"Подумай про значення: дорога, якою їдуть, і дорогий — який багато коштує.",

    {type:"select", q:"Розбери за будовою слово <span class='word'>підводний</span>",
     hint:"Зміни форму: підводн<b>ого</b>, підводн<b>им</b> — що змінюється? Споріднені: вода, водичка — який спільний корінь?",
     items:[["Префікс:",["немає","під","вод","н","ий"],1],["Корінь:",["під","вод","водн","н"],1],["Суфікс:",["немає","під","н","ий"],2],["Закінчення:",["нульове","н","ий","ний"],2]]},
    {type:"select", q:"Розбери за будовою слово <span class='word'>підсніжник</span>",
     hint:"Зміни форму: підсніжник — підсніжник<b>а</b> — підсніжник<b>ом</b>. У називному відмінку в кінці нічого немає — отже, закінчення нульове. Споріднені: сніг, сніжок (г — ж чергуються).",
     items:[["Префікс:",["немає","під","сніж","ник"],1],["Корінь:",["під","сніг","сніж","ник"],2],["Суфікс:",["немає","сніж","ник","ік"],2],["Закінчення:",["нульове","к","ик","ник"],0]]},

     items:[["Префікс:",["немає","во","вод"],0],["Корінь:",["во","вод","водич","ичк"],1],["Суфікс:",["немає","ич","ичк","а"],2],["Закінчення:",["нульове","а","ка"],1]]},

     hint:"Пам'ятай «Кафе «Птах»»: перед к, п, т, ф, х — с-, перед іншими буквами — з-.",
     items:[["…формувати",["з","с"],1],["…хотіти",["з","с"],1],["…казати",["з","с"],1],["…чесати",["з","с"],0],["…ховати",["з","с"],1],["…шивати",["з","с"],0]]},

     lines:["Свині + пасти = [[свинопас]]","Земля + трусити = [[землетрус]]","Ясний + очі = [[ясноокий|ясноока|ясноокі]]","Місяць + ходити = [[місяцехід]]","Хліб + робити = [[хлібороб]]"]}
  ],
  hw:`<b>Підручник, с. 88, вправа 3.</b> Утвори складні слова, використовуючи підказки, і запиши їх у зошит:<br>

/* ================= ЗБЕРЕЖЕННЯ ПРОГРЕСУ ================= */
let store={};
try{ store=JSON.parse(localStorage.getItem("polina-progress")||"{}"); }catch(e){}
function save(){ try{ localStorage.setItem("polina-progress",JSON.stringify(store)); }catch(e){} }
function rec(key){ return store[key]||(store[key]={ex:{},done:false}); }

const WEEKS=[1,2,3,4];
const $app=document.getElementById("app");
const toast=t=>{const e=document.getElementById("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2200)};


/* ================= ЗІРОЧКИ ================= */
/* За кожну вправу: 2 ⭐ з першої спроби, 1 ⭐ — якщо вийшло не одразу. За виконаний урок: +3 ⭐. */
function starsEarned(){
  let n=0;
  for(const k in LESSONS){ const r=store[k]; if(!r) continue;
    for(const i in r.ex){ const e=r.ex[i]; if(e&&e.ok) n+= e.tries===1?2:1; }
    if(r.done) n+=3;
  }
  return n;
}
function shop(){ return store.__shop||(store.__shop={owned:[],wear:{},spent:0}); }
function stars(){ return starsEarned()-shop().spent; }
function updateBar(){
  const b=document.getElementById("mebar"); if(!b) return;
  b.innerHTML=`<span class="mini">${avatarSVG(wearing())}</span><span class="st-count">⭐ ${stars()}</span>`;
}

/* ================= СТОРІНКА «МІЙ АВАТАР» ================= */
let tryOn={}, curCat="top";
function avatarPage(){
  const w=Object.assign(wearing(),tryOn), sh=shop();
  const items=ITEMS.filter(x=>x.cat===curCat);
  let html=`<div class="crumbs"><a href="#">🏠 Тижні</a> › Мій аватар</div>
  <div class="card av-card"><div class="av-big">${avatarSVG(w)}</div>
   <div class="av-side"><div class="bank">⭐ ${stars()}</div><p class="note">Зірочки ти отримуєш за вправи: <b>2 ⭐</b> — якщо правильно з першої спроби, <b>1 ⭐</b> — якщо з другої. За кожен виконаний урок — ще <b>+3 ⭐</b>.</p>
   ${Object.keys(tryOn).length?`<button class="btn ghost" onclick="tryOn={};avatarPage()">↩ Зняти приміряне</button>`:""}</div></div>
  <div class="cats">${CATS.map(c=>`<button class="cat ${c.id===curCat?"on":""}" onclick="curCat='${c.id}';avatarPage()">${c.ic} ${c.name}</button>`).join("")}</div>
  <div class="shop">${items.map(it=>{
    const own=owns(it.id), worn=wearing()[it.cat]===it.id, trying=tryOn[it.cat]===it.id;
    const sw=it.col?`<span class="sw" style="background:${it.col}"></span>`:`<span class="sw emo">${it.sw}</span>`;
    let act;
    if(worn) act=`<span class="tag on">✓ Вдягнуто</span>`;
    else if(own) act=`<button class="btn sm" onclick="wearIt('${it.id}')">Вдягнути</button>`;
    else act=`<button class="btn sm pink" onclick="buy('${it.id}')">Купити ⭐ ${it.price}</button>`;
    return `<div class="item ${trying?"trying":""}" onclick="if(event.target.tagName!=='BUTTON'){tryIt('${it.id}')}">${sw}<b>${it.name}</b>${!own?`<small>приміряй — натисни</small>`:""}${act}</div>`;
  }).join("")}</div>`;
  $app.innerHTML=html;
}
function tryIt(id){ const it=ITEM[id]; if(wearing()[it.cat]===id) delete tryOn[it.cat]; else tryOn[it.cat]=id; avatarPage(); }
function wearIt(id){ const it=ITEM[id]; shop().wear[it.cat]=id; delete tryOn[it.cat]; save(); updateBar(); avatarPage(); }
function buy(id){
  const it=ITEM[id];
  if(stars()<it.price){ toast(`Потрібно ще ⭐ ${it.price-stars()} — виконуй завдання! 💪`); return; }
  const sh=shop(); sh.owned.push(id); sh.spent+=it.price; sh.wear[it.cat]=id; delete tryOn[it.cat]; save(); updateBar(); toast(`Ура! «${it.name}» — твоє! 🎉`); avatarPage();
}



/* ================= КОД ЗБЕРЕЖЕННЯ ================= */
/* Увесь прогрес у коротких латинських символах: POL1~урок|виконано|вправа.спроби.ок,...~S|витрачено|куплене|вдягнуте */
function saveCode(){
  const parts=["POL1"];
  for(const k in store){ if(k==="__shop") continue; const r=store[k]; if(!r||!r.ex) continue;
    const ex=Object.keys(r.ex).map(i=>`${i}.${r.ex[i].tries}.${r.ex[i].ok?1:0}`).join(",");
    if(ex||r.done) parts.push(`${k}|${r.done?1:0}|${ex}`); }
  const sh=shop(); parts.push(`S|${sh.spent}|${sh.owned.join(",")}|${Object.entries(sh.wear).map(([a,b])=>a+"="+b).join(",")}`);
  return parts.join("~");
}
function parseCode(c){
  c=String(c).replace(/\s+/g,""); const i=c.indexOf("POL1~"); if(i<0) return null; c=c.slice(i);
  const parts=c.split("~").slice(1), st={};
  for(const p of parts){ const f=p.split("|");
    if(f[0]==="S"){ st.__shop={spent:+f[1]||0, owned:f[2]?f[2].split(",").filter(x=>ITEM[x]):[], wear:{}};
      (f[3]||"").split(",").filter(Boolean).forEach(x=>{const [a,b]=x.split("="); if(ITEM[b]) st.__shop.wear[a]=b;}); continue; }
    if(!/^\d+-\w+-\w+$/.test(f[0])) return null;
    const r={done:f[1]==="1",ex:{}}; (f[2]||"").split(",").filter(Boolean).forEach(x=>{const [n,t,o]=x.split("."); r.ex[n]={tries:+t||1,ok:o==="1"};}); st[f[0]]=r; }
  return st;
}
function copySave(){
  const c=saveCode(), ta=document.getElementById("savebox"); ta.style.display="block"; ta.value=c;
  if(navigator.clipboard) navigator.clipboard.writeText(c).then(()=>toast("Код скопійовано! Надішли його вчительці 💾"),()=>{ta.select();toast("Виділи код і скопіюй")}); else ta.select();
}
let pendingRestore=null;
function tryRestore(){
  const v=document.getElementById("restorebox").value, st=parseCode(v), msg=document.getElementById("restoremsg");
  if(!st){ msg.className="fb no"; msg.textContent="Це не схоже на код збереження. Перевір, чи скопіювала його повністю."; pendingRestore=null; return; }
  pendingRestore=st; const n=Object.keys(st).filter(k=>k!=="__shop").length;
  msg.className="fb"; msg.innerHTML=`Знайдено уроків: ${n}. Поточний прогрес на цьому пристрої буде замінено. <button class="btn sm pink" onclick="doRestore()">Так, відновити</button>`;
}
function doRestore(){ if(!pendingRestore) return; store=pendingRestore; pendingRestore=null; save(); toast("Прогрес відновлено! 🎉"); route(); }
try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist(); }catch(e){}

/* ================= НАВІГАЦІЯ ================= */
function setHome(h){
  const b=document.getElementById("homeBtn"); if(!b) return;
  const m=h.match(/^w(\d+)(?:-(\w+))?(?:-(\w+))?$/);
  let href="#", label="Головна";
  if(m&&m[3]){ href=`#w${m[1]}-${m[2]}`; label="Уроки дня"; }
  else if(m&&m[2]){ href=`#w${m[1]}`; label="Тиждень"; }
  b.href=href; b.querySelector("span").textContent=label;
  b.classList.toggle("hide", !h);
}
function lessonSeq(w){ const a=[]; DAYS.forEach(d=>d.subj.forEach(s=>{ if(LESSONS[`${w}-${d.id}-${s}`]) a.push({d,s}); })); return a; }
function lessonNav(w,did,s,top){
  const seq=lessonSeq(w), i=seq.findIndex(x=>x.d.id===did&&x.s===s);
  const link=(x,cls,arrow)=>{
    if(!x) return `<a class="${cls} empty"></a>`;
    const other=x.d.id!==did, url=`#w${w}-${x.d.id}-${x.s}`;
    if(top) return `<a class="${cls}" href="${url}">${cls==="prev"?"← ":""}${SUBJ[x.s].ic} ${SUBJ[x.s].name}${other?" ("+x.d.short+")":""}${cls==="next"?" →":""}</a>`;
    return `<a class="${cls}" href="${url}"><small>${cls==="prev"?"← Попередній урок"+(other?" · "+x.d.name:""):"Наступний урок"+(other?" · "+x.d.name:"")+" →"}</small><b>${SUBJ[x.s].ic} ${SUBJ[x.s].name}</b></a>`;
  };
  return `<div class="${top?"lnav-top":"lnav"}">${link(seq[i-1],"prev")}${link(seq[i+1],"next")}</div>`;
}
addEventListener("scroll",()=>{ const u=document.getElementById("topBtn"); if(u) u.classList.toggle("on", scrollY>400); },{passive:true});

/* ================= МАРШРУТИ (#w1, #w1-mon, #w1-mon-math) ================= */
function route(){
  const h=location.hash.slice(1);
  updateBar(); setHome(h);
  if(h==="avatar") return avatarPage();
  tryOn={};
  const m=h.match(/^w(\d+)(?:-(\w+))?(?:-(\w+))?$/);
  if(!m) return home();
  const w=+m[1], d=m[2], s=m[3];
  if(s) return lesson(w,d,s);
  if(d) return day(w,d);
  return week(w);
}
window.addEventListener("hashchange",()=>{route();scrollTo(0,0)});

function lessonState(w,d,s){
  const k=`${w}-${d}-${s}`;
  if(!LESSONS[k]) return "soon";
  return store[k]&&store[k].done?"done":"open";
}
const mainEx = L => L.ex.filter(e=>!e.hw);

function home(){
  let html=`<section class="hero"><span class="hero-deco l">📚</span><span class="hero-deco r">🐶</span>
    <div class="hero-badge">⭐ 4 клас • вчимося разом</div>
    <h1>Привіт, <span>Поліно!</span> 👋</h1>
    <p class="hero-sub">Коли клас навчається в школі, ти навчаєшся разом з нами тут. Виконуй завдання, збирай зірочки й наряджай свого аватара та песика!</p>
    <div class="hero-slogan">«Маленький крок щодня — і все вийде!» 💗</div></section>
  <a class="tile avatar-tile" href="#avatar" style="margin-bottom:16px"><span class="ic">${avatarSVG(wearing())}</span><span><b>Мій аватар</b><small>У тебе ⭐ ${stars()} — загляни в крамничку!</small></span><span class="st">🛍️</span></a>
  <h2 style="margin:4px 0 12px">Обери тиждень</h2><div class="grid">`;
  WEEKS.forEach(w=>{
    let tot=0,dn=0,any=false;
    DAYS.forEach(d=>d.subj.forEach(s=>{const st=lessonState(w,d.id,s); if(st!=="soon"){any=true;tot++; if(st==="done")dn++;}}));
    const range=weekRange(w);
    html+=`<a class="tile ${any?"":"soon"}" href="#w${w}">
      <span class="ic" style="background:#ffe6f1">📅</span>
      <span><b>Тиждень ${w}</b><small>${range?range+" · ":""}${any?`виконано ${dn} з ${tot}`:"скоро з'явиться"}</small>
      ${any?`<div class="prog" style="width:160px"><i style="width:${tot?dn/tot*100:0}%"></i></div>`:""}</span>
      <span class="st">${any&&dn===tot?"⭐":"›"}</span></a>`;
  });
  html+=`</div><div class="card" style="margin-top:18px"><h3>📨 Звіт для вчительки</h3>
  <p class="note">Натисни кнопку — і надішли текст вчительці в месенджер.</p>
  <button class="btn" onclick="report()">Скопіювати звіт</button>
  <textarea class="report" id="rep" readonly style="margin-top:10px;display:none"></textarea></div>
  <div class="card"><h3>💾 Збереження прогресу</h3>
  <p class="note">Галочки, зірочки й аватар зберігаються на цьому телефоні. Щоб нічого не загубилося, у кожному звіті для вчительки є <b>код збереження</b>. Якщо прогрес зникне (або ти відкриєш сайт на іншому пристрої) — встав останній код сюди, і все повернеться.</p>
  <div class="row"><button class="btn ghost" onclick="copySave()">Скопіювати код</button></div>
  <textarea class="report" id="savebox" readonly style="display:none;min-height:70px"></textarea>
  <details class="hint" style="margin-top:8px"><summary>🔄 Відновити прогрес із коду</summary><div style="background:#fff;border-color:var(--line)">
   <textarea class="report" id="restorebox" placeholder="Встав сюди код, який починається з POL1~" style="min-height:70px"></textarea>
   <div class="row"><button class="btn" onclick="tryRestore()">Відновити</button></div><div id="restoremsg" class="fb"></div></div></details></div>`;
  $app.innerHTML=html;
}

function week(w){
  const range=weekRange(w);
  let html=`<div class="crumbs"><a href="#">🏠 Тижні</a> › Тиждень ${w}${range?" · "+range:""}</div><div class="grid">`;
  DAYS.forEach((d,i)=>{
    const sts=d.subj.map(s=>lessonState(w,d.id,s));
    const avail=sts.filter(x=>x!=="soon").length, dn=sts.filter(x=>x==="done").length;
    const dt=dayDate(w,i);
    html+=`<a class="tile ${avail?"":"soon"}" href="#w${w}-${d.id}">
      <span class="ic" style="background:#ffe6f1">${d.short}</span>
      <span><b>${d.name}${dt?`, ${fmt(dt)}`:""}</b><small>${d.subj.map(s=>SUBJ[s].ic).join(" ")} · ${avail?`${dn}/${avail} виконано`:"скоро"}</small></span>
      <span class="st">${avail&&dn===avail?"✅":"›"}</span></a>`;
  });
  $app.innerHTML=html+"</div>";
}

function day(w,did){
  const i=DAYS.findIndex(x=>x.id===did), d=DAYS[i]; if(!d) return home();
  const dt=dayDate(w,i);
  let html=`<div class="crumbs"><a href="#">🏠 Тижні</a> › <a href="#w${w}">Тиждень ${w}</a> › ${d.name}${dt?", "+fmt(dt):""}</div><div class="grid">`;
  d.subj.forEach(s=>{
    const st=lessonState(w,did,s), L=LESSONS[`${w}-${did}-${s}`];
    html+=`<a class="tile ${st==="soon"?"soon":""}" href="#w${w}-${did}-${s}">
      <span class="ic" style="background:${SUBJ[s].bg}">${SUBJ[s].ic}</span>
      <span><b>${SUBJ[s].name}</b><small>${L?L.topic:"Урок ще готується"}</small></span>
      <span class="st">${st==="done"?"✅":"›"}</span></a>`;
  });
  $app.innerHTML=html+"</div>";
}

function lesson(w,did,s){
  const d=DAYS.find(x=>x.id===did), S=SUBJ[s], key=`${w}-${did}-${s}`, L=LESSONS[key];
  let html=`<div class="crumbs"><a href="#">🏠</a> › <a href="#w${w}">Тиждень ${w}</a> › <a href="#w${w}-${did}">${d?d.name:""}</a> › ${S?S.name:""}</div>`;
  if(!L||!S){ $app.innerHTML=html+`<div class="card"><h2>Урок ще готується 🛠️</h2><p>Зазирни трохи пізніше!</p></div>`; return; }
  const r=rec(key);
  html+=lessonNav(w,did,s,true);
  html+=`<div class="card"><span class="badge" style="background:${S.c}">${S.ic} ${S.name}</span>
    <h2>${L.topic}</h2>${L.src?`<div class="src">📘 ${L.src}</div>`:""}<p>${L.summary}</p>
    <div class="theory"><b>📖 Пригадаймо</b>${L.theory}</div></div>`;
  if(L.test) html+=`<div class="card test"><h3>📝 Діагностувальна робота</h3><p>${L.test}</p></div>`;
  let first=true;
  if(mainEx(L).length){
    html+=`<div class="card"><h3>✏️ ${L.test?"Тренування":"Вправи"}</h3>`;
    L.ex.forEach((e,i)=>{ if(e.hw) return; html+=exBlock(e,i,first); first=false; });
    html+=`</div>`;
  }
  html+=`<div class="card hw"><h3>🏠 Домашнє завдання</h3><div>${L.hw}</div>`;
  if(L.cards) html+=`<div class="cards">${L.cards.map(c=>`<button class="fc" onclick="this.classList.toggle('flip')"><span class="f">${c[0]}</span><span class="b">${c[1]}</span></button>`).join("")}</div>`;
  first=true;
  L.ex.forEach((e,i)=>{ if(!e.hw) return; html+=exBlock(e,i,true); });
  html+=`</div><button class="btn done-btn" style="background:${r.done?"var(--ok)":"var(--accent)"}" onclick="finish('${key}')">${r.done?"✅ Урок виконано":"Я виконала урок!"}</button>`;
  html+=lessonNav(w,did,s,false);
  $app.innerHTML=html;
  window.__cur={key,L};
  L.ex.forEach((e,i)=>{ if(r.ex[i]&&r.ex[i].ok){ const f=document.getElementById("fb"+i); f.className="fb ok"; f.textContent="✔ Вже виконано"; } });
}
function exBlock(e,i,first){
  return `<div class="ex ${first?"first":""}" id="ex${i}">${renderEx(e,i)}<div class="row"><button class="btn ghost" onclick="check(${i})">Перевірити</button></div><div class="fb" id="fb${i}"></div></div>`;
}

function renderEx(e,i){
  let h=`<div class="q">${e.q}</div>`;
  if(e.text) h+=`<div class="read">${e.text}</div>`;
  if(e.hint) h+=`<details class="hint"><summary>💡 Підказка</summary><div>${e.hint}</div></details>`;
  if(e.type==="choice") h+=`<div class="opts">${e.options.map((o,j)=>`<button class="opt" data-v="${j}" onclick="pick(this)">${o}</button>`).join("")}</div>`;
  if(e.type==="tf") h+=`<div class="opts"><button class="opt" data-v="1" onclick="pick(this)">👍 Правда</button><button class="opt" data-v="0" onclick="pick(this)">👎 Неправда</button></div>`;
  if(e.type==="roman"){
    h+=e.build.map((b,j)=>`<div class="rb"><div class="row"><b style="min-width:42px">${b[0]} =</b><span class="rdisp ans" id="rb${i}_${j}" data-a="${b[1]}"></span></div>
      <div class="rkeys">${["I","V","X","L","C"].map(c=>`<button class="rk" onclick="rk(${i},${j},'${c}')">${c}</button>`).join("")}<button class="rk del" onclick="rk(${i},${j},'⌫')">⌫</button></div></div>`).join("");
  }
  if(e.type==="fill"||e.type==="roman"){
    if(!e.lines) return h;
    let k=0;
    h+=e.lines.map(line=>`<div class="row">${line.replace(/\[\[(.+?)\]\]/g,(_,a)=>{const id=`in${i}_${k++}`;const w=Math.max(2,a.split("|")[0].length);return `<input class="ans sm" style="width:${Math.min(160,40+w*13)}px" id="${id}" data-a="${a.replace(/"/g,"&quot;")}" autocomplete="off" autocapitalize="characters" spellcheck="false">`;})}</div>`).join("");
  }
  if(e.type==="select") h+=e.items.map((it,j)=>`<div class="row"><span>${it[0]}</span><select class="ans" id="in${i}_${j}"><option value="">— обери —</option>${it[1].map((o,k)=>`<option value="${k}">${o}</option>`).join("")}</select>${it[3]?`<span>${it[3]}</span>`:""}</div>`).join("");
  return h;
}
function rk(i,j,c){ const d=document.getElementById(`rb${i}_${j}`); d.classList.remove("right","wrong"); d.textContent = c==="⌫" ? d.textContent.slice(0,-1) : (d.textContent.length<9 ? d.textContent+c : d.textContent); }
function pick(b){ b.parentNode.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel","right","wrong")); b.classList.add("sel"); }

/* порівняння відповідей: регістр, пробіли, апостроф; українські Х С І М → латинські (для римських цифр) */
const LOOK={"х":"x","с":"c","і":"i","м":"m"};
function norm(s,roman){
  s=String(s).toLowerCase().replace(/[’'`ʼ]/g,"'").replace(/\s+/g," ").trim();
  if(roman) s=s.replace(/[хсім]/g,ch=>LOOK[ch]);
  if(/^[\d ]+$/.test(s)) s=s.replace(/ /g,"");
  return s;
}
const isRoman=a=>/^[ivxlcdm]+$/i.test(a);

function check(i){
  const {key,L}=window.__cur, e=L.ex[i], fb=document.getElementById("fb"+i); let ok=true, empty=false;
  if(e.type==="choice"||e.type==="tf"){
    const sel=document.querySelector(`#ex${i} .opt.sel`);
    if(!sel) empty=true; else {
      const v=+sel.dataset.v, right=e.type==="tf"?(v===1)===e.answer:v===e.answer;
      sel.classList.add(right?"right":"wrong"); ok=right;
    }
  } else {
    document.querySelectorAll(`#ex${i} .ans`).forEach(el=>{
      if(el.tagName==="SPAN"){ const v=el.textContent; if(!v){empty=true;return;} const right=v===el.dataset.a; el.classList.remove("right","wrong"); el.classList.add(right?"right":"wrong"); if(!right) ok=false; return; }
      if(!el.value){empty=true;return;}
      let right;
      if(el.tagName==="SELECT"){ const j=+el.id.split("_")[1]; right=+el.value===e.items[j][2]; }
      else { const alts=el.dataset.a.split("|"); right=alts.some(a=>norm(el.value,isRoman(a))===norm(a,isRoman(a))); }
      el.classList.remove("right","wrong"); el.classList.add(right?"right":"wrong"); if(!right) ok=false;
    });
  }
  if(empty){ fb.className="fb no"; fb.textContent="Заповни всі віконця 🙂"; return; }
  const before=starsEarned();
  const r=rec(key); const er=r.ex[i]||(r.ex[i]={tries:0,ok:false});
  er.tries++; if(ok) er.ok=true; save(); award(before);
  fb.className="fb "+(ok?"ok":"no");
  fb.textContent= ok ? ["Молодчинка! 🎉","Правильно! ⭐","Чудово! 👏","Супер! 🌟"][i%4] : (e.hint?"Майже! Червоні віконця виправ — і загляни в підказку 💡":"Майже! Подумай ще раз і спробуй знову 💪");
}

function finish(key){
  const r=rec(key), L=LESSONS[key];
  const idx=L.ex.map((e,i)=>e.hw?-1:i).filter(i=>i>=0);
  const solved=idx.filter(i=>r.ex[i]&&r.ex[i].ok).length;
  if(solved<idx.length){ toast(`Виконано ${solved} з ${idx.length} вправ — доробимо?`); return; }
  const before=starsEarned();
  r.done=true; r.date=new Date().toLocaleDateString("uk-UA"); save(); toast("Урок виконано! 🌟"); award(before); route();
}

function report(){
  const lines=["Звіт Поліни 📚"];
  WEEKS.forEach(w=>DAYS.forEach(d=>d.subj.forEach(s=>{
    const k=`${w}-${d.id}-${s}`, L=LESSONS[k], r=store[k]; if(!L||!r) return;
    const idx=L.ex.map((e,i)=>e.hw?-1:i).filter(i=>i>=0), hwi=L.ex.map((e,i)=>e.hw?i:-1).filter(i=>i>=0);
    const solved=idx.filter(i=>r.ex[i]&&r.ex[i].ok).length;
    const first=idx.filter(i=>r.ex[i]&&r.ex[i].ok&&r.ex[i].tries===1).length;
    const hw = hwi.length ? (hwi.every(i=>r.ex[i]&&r.ex[i].ok)?" · ДЗ ✅":" · ДЗ ще не перевірено") : "";
    const t=L.topic.replace(/[.!?]$/,"")+(/[!?]$/.test(L.topic)?L.topic.slice(-1):"");
    const exs= idx.length ? ` · вправ ${solved}/${idx.length} (з першої спроби: ${first})` : "";
    lines.push(`Тиждень ${w}, ${d.name} — ${SUBJ[s].name}: ${t}${exs}${hw}${r.done?" · урок ✅":""}`);
  })));
  if(lines.length===1) lines.push("Поки що немає виконаних уроків.");
  else lines.push(`Зароблено зірочок: ⭐ ${starsEarned()}`);
  lines.push("", "💾 Код збереження (не видаляйте — ним можна відновити прогрес):", saveCode());
  const t=lines.join("\n"), ta=document.getElementById("rep"); ta.style.display="block"; ta.value=t;
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(()=>toast("Скопійовано! Встав у месенджер"),()=>{ta.select();toast("Виділи текст і скопіюй")});
  else ta.select();
}

   :[["📚",2,8,80],["⭐",88,6,60],["🐶",86,58,76],["✏️",4,46,64],["🌸",90,82,70],["🎀",6,82,62],["💗",48,92,46],["🦋",46,3,44],["📐",80,32,50],["🌈",18,22,56],["🐾",66,86,48],["🍭",28,70,46]];
